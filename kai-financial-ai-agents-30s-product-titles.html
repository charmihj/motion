<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국AI사이언스 | 금융특화 AI Agents · 30초 솔루션 소개</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:clamp(10px,3vw,48px);background:#edf3f9;color:#102746;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
main{width:min(100%,1200px)}
.stage{container-type:inline-size;position:relative;isolation:isolate;overflow:hidden;aspect-ratio:16/9;background:radial-gradient(ellipse at 86% 55%,#cce5ff 0%,transparent 60%),linear-gradient(125deg,#fff 7%,#f1f8ff 85%);box-shadow:0 18px 58px #22558621}
.stage::before{content:"";position:absolute;inset:0;z-index:-2;background-image:linear-gradient(#3979b51a 1px,transparent 1px),linear-gradient(90deg,#3979b51a 1px,transparent 1px);background-size:4cqw 4cqw;mask-image:linear-gradient(110deg,transparent 36%,#000 100%)}
.orbit-field{position:absolute;inset:0;z-index:-1;pointer-events:none}
.orbit,.orbit-echo{position:absolute;top:0;left:0;aspect-ratio:1;border-radius:50%}
.orbit{width:46cqw;border:1px solid #5294cc6b;transform:translate3d(var(--orbit-x,66cqw),var(--orbit-y,5cqw),0) rotate(var(--angle,0deg)) scale(var(--orbit,1));box-shadow:0 0 0 3cqw #71baff19,0 0 0 8cqw #71baff16,inset 0 0 7cqw #7ab8ee45}
.orbit::before,.orbit::after{content:"";position:absolute;border-radius:50%;background:#4f9be3;width:.85cqw;aspect-ratio:1;box-shadow:0 0 1.2cqw #75bdf5}
.orbit::before{top:13%;left:14%}.orbit::after{bottom:10%;left:18%}
.orbit-echo{width:29cqw;border:1px solid #72a9d477;background:#b1d8fa19;transform:translate3d(var(--echo-x,76cqw),var(--echo-y,23cqw),0) scale(var(--echo-scale,1))}
.orbit-echo::after{content:"";display:block;position:absolute;inset:15%;border:1px solid #72a9d449;border-radius:inherit}
.mark{position:absolute;left:8%;top:10%;display:flex;align-items:center;gap:1cqw;color:#214469;font-size:1.45cqw;font-weight:700;letter-spacing:.1em}
.mark b{font:800 2.4cqw/1 Arial,sans-serif;letter-spacing:-.06em;color:#09509f}
.mark b::after{content:"";display:inline-block;width:1px;height:1.4cqw;margin-left:1cqw;background:#7096bb}
.frame{position:absolute;inset:18% 8% 16%;display:grid;align-content:center;gap:1.7cqw;text-align:left}
.lead{font-size:2.25cqw;font-weight:800;line-height:1.4;color:#3a5979;letter-spacing:-.035em}
.headline{margin:0;font-weight:800;line-height:1.1;letter-spacing:-.065em;word-break:keep-all;transform-origin:center}
.line{display:block;font-size:5.6cqw}
.accent{position:relative;display:table;margin:.55cqw 0 0;color:#094fa4;font-size:9.5cqw;font-weight:900;-webkit-text-stroke:.12cqw currentColor;transform-origin:center;white-space:nowrap}
.stage[data-scene="0"] .accent{font-size:8.1cqw}
.opening-key{position:relative;isolation:isolate}
.opening-key::before{content:"";position:absolute;z-index:-1;inset:54% -.06em 3%;background:linear-gradient(90deg,#b9dcff,#85bff4);border-radius:.035em;transform-origin:left center;transform:scaleX(var(--opening-highlight,0));opacity:.86}
.stage[data-scene="2"] .accent{font-size:8.25cqw;word-spacing:.14em}
.stage[data-scene="4"] .line{font-size:4.25cqw}
.stage[data-scene="0"] .lead{color:#174e88}
.stage[data-scene="1"] .lead{color:#00635d}
.stage[data-scene="2"] .lead{color:#633984}
.stage[data-scene="3"] .lead{color:#8d3048}
.stage[data-scene="4"] .lead{color:#164a79}
.stage[data-scene="5"] .lead{color:#17613f}
.stage[data-scene="5"] .mark{display:none}
.stage[data-scene="5"] .frame{inset:8% 3% 17%;align-content:start;justify-items:center;gap:1.2cqw;text-align:center}
.stage[data-scene="5"] .line{font-size:2.8cqw;font-weight:700}
.stage[data-scene="5"] .headline{transform-origin:center}
.stage[data-scene="5"] .accent{left:0;margin:2.9cqw auto 0;font:700 34cqw/.86 "Bahnschrift","DIN Alternate","Arial",sans-serif;letter-spacing:var(--tracking,.022em);padding-left:var(--tracking,.022em);opacity:var(--kai-opacity,1);color:#103c73;-webkit-text-stroke:0;transform-origin:center}
.stage[data-scene="5"] .accent{transform:scale(var(--finale-scale,1))}
.stage[data-scene="5"] .accent::after{position:absolute;left:10%;bottom:-.09em;width:80%;margin:0;transform:scaleX(var(--finale-line,0));opacity:var(--finale-line,0)}
.stage[data-scene="5"] .cta{left:50%;transform:translateX(-50%)}

.accent::after{content:"";display:block;margin-top:.26em;width:100%;height:.52cqw;background:linear-gradient(90deg,#1461bb,#62b2f5);transform-origin:center;transform:scaleX(var(--underline,.24))}
.cta{position:absolute;bottom:12.5%;left:8%;color:#164d92;font-weight:700;font-size:1.85cqw;text-underline-offset:.25em}
.rule{position:absolute;bottom:9%;left:8%;right:8%;height:1px;background:#2f73ba38}
.rule span{display:block;height:1px;background:#1461bb;width:var(--progress,0%)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:12px}
button{background:#fff;color:#12365d;border:1px solid #a9bdd2;border-radius:6px;padding:8px 12px;cursor:pointer;font:inherit;font-size:13px}
button:first-child{background:#1256a8;color:#fff;border-color:#1256a8;font-weight:bold}
output{margin-left:auto;color:#395672;font:13px ui-monospace,monospace}
.stage:fullscreen{width:min(100vw,177.7778vh);height:min(100vh,56.25vw);margin:auto}
.stage::backdrop{background:#e7f0fa}
.stage[data-scene="1"] .accent{clip-path:inset(-.2em var(--wipe,0%) -.2em -.08em)}
.stage[data-scene="2"] .accent-word{display:inline-block;opacity:var(--word-opacity,1)}
.stage[data-scene="2"] .accent-word:nth-child(1){--word-opacity:var(--word-1,1)}
.stage[data-scene="2"] .accent-word:nth-child(2){--word-opacity:var(--word-2,1)}
.stage[data-scene="2"] .accent-word:nth-child(3){--word-opacity:var(--word-3,1)}
.stage[data-scene="3"] .accent{overflow:hidden;clip-path:inset(-.18em -.1em 0 -.1em)}
.stage[data-scene="3"] .accent-copy{display:block;transform:translateY(var(--rise,0%))}
.stage:not([data-scene="5"]) .lead{
  display:flex;align-items:center;gap:1.15cqw;
  font-size:3.4cqw;font-weight:900;letter-spacing:-.045em;line-height:1.25;
}
.stage:not([data-scene="5"]) .lead::before{
  content:"";width:.34cqw;height:.93em;flex:none;background:currentColor;
  transform:scaleY(var(--title-mark,1));transform-origin:center bottom;
}
</style>
</head>
<body>
<main>
  <div class="stage" id="stage" aria-label="한국AI사이언스 브랜드 필름">
    <div class="orbit-field" aria-hidden="true"><div class="orbit-echo"></div><div class="orbit"></div></div>
    <div class="mark"><b>KAI</b> 한국AI사이언스</div>
    <div class="frame">
      <div class="lead" id="lead"></div>
      <h1 class="headline" id="headline"><span class="line" id="line"></span> <span class="accent" id="accent"></span></h1>

    </div>
    <a class="cta" id="cta" href="https://www.kaiscience.co.kr/solution" target="_blank" rel="noopener" hidden>솔루션 알아보기 ↗</a>
    <div class="rule" aria-hidden="true"><span></span></div>
  </div>
  <div class="controls">
    <button id="play">음악과 함께 재생</button>
    <button id="restart">처음부터</button>
    <button id="mute" aria-pressed="false">음소거</button>
    <button id="full">전체 화면</button>
    <output id="time">00:00 / 00:30</output>
  </div>
</main>
<script>
const scenes = [
  {lead:"KAI 금융특화 AI Agent", line:"시장 분석부터 위험관리까지", accent:"금융 업무를 잇는 AI"},
  {lead:"금융시장분석 AI Agent", line:"경제 지표와 금융 리포트", accent:"실시간으로 읽다"},
  {lead:"자산관리 AI Agent", line:"운용 목표와 제약조건에 맞춰", accent:"자산 배분안을 제안"},
  {lead:"성과평가 AI Agent", line:"벤치마크와 비교해", accent:"성과 요인을 분석"},
  {lead:"위험관리 AI Agent", line:"시장·신용 리스크 측정과 스트레스 테스트", accent:"위기 징후를 포착"},
  {lead:"전략적 의사결정을 지원하는 당신의 지능형 파트너", line:"금융의 본질을 이해하는 DNA", accent:"KAI"}
];
const chords = [[50,57,62,65,69],[46,53,58,62,65],[41,53,57,60,64],[48,55,60,64,67],[45,52,57,60,64],[50,57,62,65,69]];
const length = 30;
const sceneLength = 5;
const finaleBeat = 3.75;
const byId = id => document.getElementById(id);
const stage = byId("stage"), lead = byId("lead"), headline = byId("headline");
const play = byId("play"), mute = byId("mute"), timeDisplay = byId("time");
const cta = byId("cta"), line = byId("line"), accent = byId("accent");
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
let audio, track, fade, muted = false, busy = false, playing = false;
let position = 0, startClock = 0, currentScene = -1, frame;
const clamp = value => Math.max(0, Math.min(1, value));
const ease = value => 1 - (1 - clamp(value)) ** 3;

function note(midi, start, duration, volume, soft) {
  const sound = audio.createOscillator();
  const gain = audio.createGain();
  sound.type = soft ? "sine" : "triangle";
  sound.frequency.value = 440 * 2 ** ((midi - 69) / 12);
  const attack = soft ? .72 : .025;
  gain.gain.setValueAtTime(.0001, start);
  gain.gain.exponentialRampToValueAtTime(volume, start + attack);
  gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
  sound.connect(gain).connect(fade);
  sound.start(start);
  sound.stop(start + duration + .02);
}
function scheduleScore() {
  const start = audio.currentTime + .045;
  track = audio.createGain();
  fade = audio.createGain();
  fade.connect(track).connect(audio.destination);
  track.gain.value = muted ? 0 : .78;
  fade.gain.setValueAtTime(1, start);
  fade.gain.setValueAtTime(1, start + 29.15);
  fade.gain.linearRampToValueAtTime(0, start + length);
  chords.forEach((chord, index) => {
    const downbeat = start + index * sceneLength;
    chord.slice(0,4).forEach((pitch, voice) => note(pitch, downbeat, 4.8, voice ? .029 : .10, true));
    [0,.75,1.5,2.25,3,3.75].forEach((beat, index) => {
      const melody = [2,3,4,1,3,2];
      note(chord[melody[index]] + 12, downbeat + beat, 1.35, index === 0 || index === 2 ? .11 : .065, false);
    });
  });
  const finale = start + length - sceneLength + finaleBeat;
  note(38, finale, 1.23, .13, false);
  note(57, finale, 1.08, .068, false);
  return start;
}
function paint(seconds) {
  const index = Math.min(scenes.length - 1, Math.floor(seconds / sceneLength));
  const local = seconds - index * sceneLength;
  if (index !== currentScene) {
    const scene = scenes[index];
    stage.dataset.scene = index;
    lead.textContent = scene.lead;
    line.textContent = scene.line;
    accent.textContent = scene.accent;
    if (index === 0) {
      const key = document.createElement("span");
      key.className = "opening-key";
      key.textContent = scene.accent.split(" ", 1)[0];
      accent.replaceChildren(key, scene.accent.slice(key.textContent.length));
    }
    if (index === 2) {
      const words = scene.accent.split(" ");
      const parts = words.flatMap((word, wordIndex) => {
        const span = document.createElement("span");
        span.className = "accent-word";
        span.textContent = word;
        return wordIndex === 0 ? [span] : ["\u00a0", span];
      });
      accent.replaceChildren(...parts);
    }
    if (index === 3) {
      const copy = document.createElement("span");
      copy.className = "accent-copy";
      copy.textContent = scene.accent;
      accent.replaceChildren(copy);
    }


    cta.hidden = index !== scenes.length - 1;
    currentScene = index;
  }
  const intro = ease((local - .14) / 1.1);
  const outro = index === scenes.length - 1 ? 1 : ease((sceneLength - local) / .55);
  const ready = seconds === 0 || reducedMotion.matches;
  const leadIn = ease(local / .72);
  stage.style.setProperty("--title-mark", ready ? 1 : ease(local / .32));
  lead.style.opacity = ready ? 1 : leadIn * outro;
  lead.style.transform = ready ? "none" : "translateY(" + (-1.4 * (1 - leadIn)) + "cqw)";
  headline.style.opacity = ready ? 1 : intro * outro;
  headline.style.transform = ready ? "none" : "translateY(" + (1.45 * (1 - intro)) + "cqw)";

  // Each scene reads its movement from the same clock as the score.
  const reveal = (start, duration) => ready ? 1 : ease((local - start) / duration);
  stage.style.setProperty("--opening-highlight", reveal(1.5, .9));
  const wipe = reveal(.75, 1.0);
  const rise = reveal(1.5, .72);
  const lockup = reveal(.45, 3.2);
  const finale = !ready && index === scenes.length - 1
    ? ease((local - finaleBeat) / .12) * (1 - ease((local - finaleBeat - .58) / .74))
    : 0;
  stage.style.setProperty("--finale-scale", 1 + .16 * finale);
  stage.style.setProperty("--finale-line", finale);
  stage.style.setProperty("--wipe", 100 * (1 - wipe) + "%");
  stage.style.setProperty("--word-1", reveal(.75, .48));
  stage.style.setProperty("--word-2", reveal(1.5, .48));
  stage.style.setProperty("--word-3", reveal(2.25, .48));
  stage.style.setProperty("--rise", 120 * (1 - rise) + "%");
  stage.style.setProperty("--tracking", .022 + .14 * (1 - lockup) + "em");
  stage.style.setProperty("--kai-opacity", lockup);
  stage.style.setProperty("--underline", index === 0 ? .24 + .48 * reveal(1.72, 1) : .72 * reveal(index === 2 ? 2.25 : 1.5, .85));
  // Both rings follow the music clock so their movement pauses with the score.
  const motionTime = reducedMotion.matches ? 0 : seconds;
  const angle = motionTime * Math.PI / 7.5;
  stage.style.setProperty("--orbit-x", 62 + 11 * Math.sin(angle) + "cqw");
  stage.style.setProperty("--orbit-y", 4 + 7 * Math.sin(angle + .6) + "cqw");
  stage.style.setProperty("--angle", motionTime * 11 + "deg");
  stage.style.setProperty("--orbit", 1 + .08 * Math.sin(angle - .3));
  stage.style.setProperty("--echo-x", 75 + 8 * Math.sin(angle * .76 + 1.4) + "cqw");
  stage.style.setProperty("--echo-y", 21 - 8 * Math.sin(angle * .76) + "cqw");
  stage.style.setProperty("--echo-scale", 1 + .13 * Math.sin(angle * .76));
  stage.style.setProperty("--progress", seconds / length * 100 + "%");
  timeDisplay.value = "00:" + String(Math.floor(seconds)).padStart(2, "0") + " / 00:30";
}
function tick() {
  position = Math.min(length, Math.max(0, audio.currentTime - startClock));
  paint(position);
  if (position < length && playing) frame = requestAnimationFrame(tick);
  else {
    playing = false;
    play.textContent = "다시 재생";
  }
}
async function toggle(reset = false) {
  if (busy) return;
  busy = true;
  try {
    if (playing && !reset) {
      await audio.suspend();
      playing = false;
      cancelAnimationFrame(frame);
      play.textContent = "계속 재생";
      return;
    }
    if (!audio || reset || position >= length) {
      cancelAnimationFrame(frame);
      playing = false;
      if (audio) await audio.close();
      audio = new AudioContext();
      startClock = scheduleScore();
      position = 0;
      paint(position);
    }
    await audio.resume();
    playing = true;
    play.textContent = "일시정지";
    tick();
  } catch (error) {
    playing = false;
    play.textContent = "오디오 재시도";
    console.error(error);
    if (audio && audio.state !== "closed") await audio.close();
    audio = null;
  } finally {
    busy = false;
  }
}
play.addEventListener("click", () => toggle());
byId("restart").addEventListener("click", () => toggle(true));
mute.addEventListener("click", () => {
  muted = !muted;
  mute.setAttribute("aria-pressed", String(muted));
  mute.textContent = muted ? "소리 켜기" : "음소거";
  if (audio && track) track.gain.setTargetAtTime(muted ? 0 : .78, audio.currentTime, .025);
});
byId("full").addEventListener("click", () => {
  stage.requestFullscreen().catch(() => { byId("full").textContent = "전체 화면 사용 불가"; });
});
paint(0);
</script>
</body>
</html>
